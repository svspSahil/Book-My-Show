apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-app
  labels:
    app: bms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bms
  template:
    metadata:
      labels:
        app: bms
    spec:
      containers:
      - name: bookmyshow-container
        image: svsps/bookmyshow-appv1.0.0:latest
        ports:
        - containerPort: 3000 
